[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cspack-python"
version = "0.1.0"
description = "A small NumPy/ctypes wrapper for the CSpack C ABI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
examples = [
    "jupyterlab>=4",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cspack*"]
